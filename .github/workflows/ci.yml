name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
        pandas: ["latest"]
        include:
          # pandas 2.x (2.3) alongside the latest pandas 3, on the same Python
          - python-version: "3.13"
            pandas: "2"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Pin pandas 2.x
        if: matrix.pandas == '2'
        run: python -m pip install "pandas>=2.3,<3"

      - name: Show versions
        run: python -c "import numpy, pandas, scipy, statsmodels; print('pandas', pandas.__version__, 'numpy', numpy.__version__, 'scipy', scipy.__version__, 'statsmodels', statsmodels.__version__)"

      - name: Run pytest
        run: python -m pytest tests -q --tb=short
